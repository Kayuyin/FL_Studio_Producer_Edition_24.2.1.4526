name: Comprobar FutMatch

on:
  push:
    paths:
      - 'futmatch/**'
      - '.github/workflows/futmatch-build.yml'
  pull_request:
    paths:
      - 'futmatch/**'
      - '.github/workflows/futmatch-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: futmatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: futmatch/package-lock.json
      - run: npm ci
      - run: npm run build

  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: futmatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Compila firestore.rules y ejecuta consultas reales contra el emulador,
      # incluyendo el acceso del dueño, los dos equipos y la denegación de terceros.
      # No utiliza credenciales ni modifica Firebase de producción.
      - run: npm ci
      - run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.0
      - run: npx --yes firebase-tools@14.18.0 emulators:exec --project demo-futmatch --only firestore "node tests/reservas.rules.test.mjs"
